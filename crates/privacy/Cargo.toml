[package]
name = "obscura-privacy"
version = "0.1.0"
edition = "2021"
description = "ZK privacy module for Obscura Network — shielded pool with compliance disclosure"

[dependencies]
sov-modules-api = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "9fa85b81a9c858e30d76ab7acc43052f142f43c5" }
sov-bank = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "9fa85b81a9c858e30d76ab7acc43052f142f43c5" }
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
getrandom = "0.2"
rand = "0.8"

# SP1 prover (Phase 2 — real ZK proofs)
sp1-sdk = { version = "6.0.2", optional = true, features = ["blocking"] }
sp1-prover = { version = "6.0.2", optional = true }
sp1-verifier = { version = "6.0.2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
# Used in combined_prover.rs for serializing SP1 proofs (only needed with sp1 feature)
bincode = { version = "1", optional = true }

[features]
native = ["sov-modules-api/native"]
# Enable real SP1/Groth16 proofs (Phase 2)
sp1 = ["sp1-sdk", "sp1-verifier", "sp1-prover", "tokio", "bincode"]
