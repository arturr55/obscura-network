[package]
name = "obscura-privacy"
version = "0.1.0"
edition = "2021"
description = "ZK privacy module for Obscura Network — shielded pool with compliance disclosure"

[dependencies]
sov-modules-api = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "9fa85b81a9c858e30d76ab7acc43052f142f43c5" }
sov-bank = { git = "https://github.com/Sovereign-Labs/sovereign-sdk.git", rev = "9fa85b81a9c858e30d76ab7acc43052f142f43c5" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[features]
native = ["sov-modules-api/native"]
