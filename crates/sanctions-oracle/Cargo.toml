[package]
name = "sanctions-oracle"
version = "0.1.0"
edition = "2021"
description = "OFAC SDN list oracle — builds a sorted Merkle tree and publishes the root for ZK sanctions proofs"

[[bin]]
name = "sanctions-oracle"
path = "src/main.rs"

[[bin]]
name = "sanctions-server"
path = "src/server_main.rs"

[dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking"] }
quick-xml = { version = "0.36", features = ["serialize"] }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
